<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ABSTRACT SHAKER — 3D Clay Dance</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="game-canvas"></canvas>

  <!-- Start Screen -->
  <div id="start-screen" class="screen">
    <div class="banner-bar">🟡🍥🍩👁️🎪🌀✨💥🍌👽🤡🐙💀🌵🎭</div>
    <h1 class="game-title">ABSTRACT<br><span class="title-accent">CLAY</span></h1>
    <p class="tagline">3D Meme Dance Blob<br>No score. No fail. Just vibe & mutate.</p>

    <!-- Character Customizer -->
    <div class="char-customizer">
      <div class="char-preview-wrap">
        <canvas id="char-preview-canvas" width="260" height="300"></canvas>
        <div class="char-name" id="char-name">ABSTRACT BLOB</div>
      </div>
      <div class="char-controls">
        <div class="ctrl-row">
          <button class="ctrl-btn" data-part="head">👁️ HEAD</button>
          <button class="ctrl-btn" data-part="body">🌀 BODY</button>
        </div>
        <div class="ctrl-row">
          <button class="ctrl-btn" data-part="limbs">🦾 LIMBS</button>
          <button class="ctrl-btn" data-part="skin">🎨 SKIN</button>
        </div>
        <div class="ctrl-row">
          <button class="ctrl-btn" data-part="face">😜 FACE</button>
          <button class="ctrl-btn random-all" data-part="all">🎲 RANDOM ALL</button>
        </div>
      </div>
      <div class="preset-row">
        <div class="preset-label">QUICK PICKS</div>
        <div class="preset-list" id="preset-list"></div>
      </div>
    </div>

    <button id="start-btn" class="big-btn">LET'S MELT!</button>
    <div class="tip">👆 Tap anywhere · ⌨️ any key · 🎵 Idle goes crazy on its own.</div>
  </div>

  <!-- Game HUD (minimal — no score, no fail) -->
  <div id="hud" class="hidden">
    <button id="back-btn" class="back-btn" title="Back to character select">←</button>
    <div class="vibe-bar" id="vibe-bar">
      <div class="vibe-fill" id="vibe-fill"></div>
      <div class="vibe-label" id="vibe-label">VIBE 0%</div>
    </div>
    <div class="blob-count" id="blob-count">1 BLOB</div>
  </div>

  <!-- Meme fly popups container -->
  <div id="popups"></div>

  <!-- Meme storm overlay (merge explosion) -->
  <div id="meme-storm" class="hidden"></div>
</div>

<!-- Three.js via importmap -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module" src="game.js?v=9"></script>
</body>
</html>
